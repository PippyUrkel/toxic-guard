<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ToxiGuard NLP Inspector</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 12px;
            width: 280px;
            background: #13111c;
            color: #f8fafc;
            margin: 0;
        }
        h3 {
            margin: 0 0 6px;
            font-size: 15px;
            color: #5eead4;
        }
        p.sub {
            margin: 0 0 10px;
            font-size: 11px;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 60px;
            border-radius: 8px;
            border: 1px solid #7c3aed;
            background: #1e1b4b;
            color: #fff;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        button {
            width: 100%;
            padding: 8px;
            background: linear-gradient(90deg, #7c3aed, #14b8a6);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #output {
            margin-top: 10px;
            font-size: 11.5px;
            background: rgba(255,255,255,0.06);
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <h3>🛡️ ToxiGuard NLP (25PEC4CS1)</h3>
    <p class="sub">Real-time BiLSTM + Lesk WSD + Edit Distance Guard</p>
    <textarea id="commentInput" placeholder="Test a message (e.g. You are killing it! or K1ll him!)"></textarea>
    <button id="sendBtn">Analyze Comment</button>
    <div id="output"></div>
    <script src="popup.js"></script>
</body>
</html>
