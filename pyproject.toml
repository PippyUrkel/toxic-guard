[project]
name = "toxiguard"
version = "2.0.0"
description = "ToxiGuard — Multi-Level Toxic Comment Detection & 25PEC4CS1 NLP Workbench (Fr. CRCE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.8.1",
    "gradio>=4.0.0",
    "jinja2>=3.1.0",
    "tensorflow>=2.16.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
toxiguard = "start:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toxicity_app"]
py-modules = ["start"]
